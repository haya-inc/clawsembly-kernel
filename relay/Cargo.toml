[package]
name = "clawsembly-network-relay"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.97"
async-trait = "=0.1.91"
bincode = "=1.3.3"
futures-util = "=0.3.31"
subtle = "=2.6.1"
tokio = { version = "=1.44.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-tungstenite = "=0.24.0"
url = "=2.5.4"
virtual-net = { version = "=0.601.0", default-features = false, features = ["host-net", "remote"] }
