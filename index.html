<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clawsembly Kernel · OpenClaw state contract</title>

  <body>
    <main>
      <p class="eyebrow">Clawsembly Kernel · Artifact-derived contract</p>
      <h1>Official OpenClaw state, browser-native</h1>

      <output id="status" data-state="idle">Idle</output>
      <pre id="result" aria-live="polite"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
