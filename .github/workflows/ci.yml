name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: .cache/clawsembly-artifacts
          key: clawsembly-artifacts-${{ runner.os }}-${{ hashFiles('contracts/*artifact.json') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            provider-broker/target
            relay/target
          key: clawsembly-ci-${{ runner.os }}-${{ hashFiles('package-lock.json', 'provider-broker/Cargo.lock', 'relay/Cargo.lock', 'patches/virtual-net/**') }}
          restore-keys: |
            clawsembly-ci-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          CLAWSEMBLY_ARTIFACT_CACHE: .cache/clawsembly-artifacts
