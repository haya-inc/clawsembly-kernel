[package]
name = "clawsembly-provider-broker"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
publish = false

[dependencies]
anyhow = "=1.0.104"
async-stream = "=0.3.6"
axum = "=0.8.9"
futures-util = "=0.3.33"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"] }
serde_json = "=1.0.151"
subtle = "=2.6.1"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
zeroize = "=1.9.0"
